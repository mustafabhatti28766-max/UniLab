# Free deploy on Render (https://render.com): New → Blueprint → select this repo.
# Free plan: no persistent disk, so the demo data is re-created whenever the service restarts.
services:
  - type: web
    name: unilab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: Asia/Dhaka # set to your university's time zone
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel web address, e.g. https://unilab.vercel.app (you'll be asked for it on deploy)
      - key: CORS_ORIGIN
        sync: false
